<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#176b5b"><title>بيتي وحساباتي</title>
<style>
:root{--green:#176b5b;--mint:#e7f4ef;--ink:#18332d;--muted:#71827d;--bg:#f4f7f5;--red:#c64b4b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink)}
header{background:linear-gradient(135deg,#14594d,#258a70);color:white;padding:28px 20px 34px;border-radius:0 0 26px 26px}
header h1{margin:0;font-size:25px}header p{margin:7px 0 0;opacity:.85;font-size:14px}
main{max-width:720px;margin:auto;padding:16px}
.summary{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:-18px}
.card{background:white;border-radius:17px;padding:16px;box-shadow:0 5px 18px #153b3010}
.card small{color:var(--muted)}.amount{font-size:22px;font-weight:800;margin-top:7px}.total{grid-column:1/-1;background:#173e35;color:white}.total small{color:#cde4dc}
h2{font-size:18px;margin:22px 2px 12px}.form{display:grid;grid-template-columns:1fr 1fr;gap:10px}
input,select,button{font:inherit;border-radius:12px;padding:13px;border:1px solid #dce7e2;background:white;min-width:0}
button{background:var(--green);color:white;border:0;font-weight:700;cursor:pointer}.form button{grid-column:1/-1}
.list{display:grid;gap:9px}.item{display:flex;align-items:center;justify-content:space-between;gap:10px}.item b{display:block}.item small{color:var(--muted)}.item strong{white-space:nowrap}.del{background:#fff0f0;color:var(--red);padding:8px 11px}
.empty{text-align:center;color:var(--muted);padding:20px}
footer{text-align:center;color:var(--muted);font-size:12px;padding:24px}
@media(max-width:390px){.form{grid-template-columns:1fr}.form button{grid-column:auto}}
</style></head><body>
<header><h1>🏡 بيتي وحساباتي</h1><p>تابع مصروفات البيت بسهولة وراحة</p></header>
<main>
<section class="summary">
<div class="card total"><small>إجمالي مصروفات هذا الشهر</small><div class="amount" id="monthTotal">0</div></div>
<div class="card"><small>مصروفات اليوم</small><div class="amount" id="todayTotal">0</div></div>
<div class="card"><small>كل المصروفات المسجلة</small><div class="amount" id="allTotal">0</div></div>
</section>
<h2>➕ إضافة مصروف جديد</h2>
<form class="card form" id="expenseForm">
<input id="title" placeholder="وصف المصروف" required>
<input id="amount" type="number" min="1" step="any" placeholder="المبلغ" required>
<select id="category">
<option>خضار</option><option>السوبر ماركت</option><option>الوقود للعربية</option><option>احتياج العربية</option><option>فواتير زين</option><option>فواتير سوداني</option><option>فواتير الكهرباء</option><option>مصروفات الوالدة</option><option>الديون</option><option>مصاريف المدارس اليومية</option><option>مواصلات</option><option>صحة ودواء</option><option>أخرى</option>
</select>
<input id="date" type="date" required>
<button type="submit">حفظ المصروف</button>
</form>
<h2>📋 سجل المصروفات</h2>
<div class="card list" id="expenses"><div class="empty">لا توجد مصروفات بعد. أضف أول مصروف الآن.</div></div>
<footer>بيتي وحساباتي · بياناتك محفوظة على هذا الجهاز</footer>
</main>
<script>
const $=id=>document.getElementById(id), key='bayti_expenses_v1';
let expenses=JSON.parse(localStorage.getItem(key)||'[]');
const today=new Date().toISOString().slice(0,10);$('date').value=today;
const money=n=>new Intl.NumberFormat('ar',{maximumFractionDigits:2}).format(n);
function render(){
const now=new Date(), ym=now.toISOString().slice(0,7);
const sum=a=>a.reduce((s,x)=>s+Number(x.amount),0);
$('monthTotal').textContent=money(sum(expenses.filter(x=>x.date.startsWith(ym))));
$('todayTotal').textContent=money(sum(expenses.filter(x=>x.date===today)));
$('allTotal').textContent=money(sum(expenses));
const box=$('expenses');box.innerHTML='';
if(!expenses.length){box.innerHTML='<div class="empty">لا توجد مصروفات بعد. أضف أول مصروف الآن.</div>';return}
[...expenses].sort((a,b)=>b.date.localeCompare(a.date)||b.id-a.id).forEach(x=>{
const el=document.createElement('div');el.className='item';
const info=document.createElement('div');const b=document.createElement('b');b.textContent=x.title;
const sm=document.createElement('small');sm.textContent=x.category+' · '+x.date;info.append(b,sm);
const right=document.createElement('div');right.style.display='flex';right.style.alignItems='center';right.style.gap='8px';
const val=document.createElement('strong');val.textContent=money(x.amount);const del=document.createElement('button');del.className='del';del.textContent='حذف';del.onclick=()=>{if(confirm('هل تريد حذف هذا المصروف؟')){expenses=expenses.filter(y=>y.id!==x.id);save()}};
right.append(val,del);el.append(info,right);box.append(el);
});
}
function save(){localStorage.setItem(key,JSON.stringify(expenses));render()}
$('expenseForm').addEventListener('submit',e=>{e.preventDefault();expenses.push({id:Date.now(),title:$('title').value.trim(),amount:Number($('amount').value),category:$('category').value,date:$('date').value});save();$('title').value='';$('amount').value='';$('date').value=today});
render();
</script></body></html>
